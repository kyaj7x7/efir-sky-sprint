name: Publish Sky Sprint v1.1.1
on:
  push:
    paths:
      - .github/workflows/publish-sky-v111.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify package
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/sky-sprint-win-unpacked-v1.1.1.zip" -o package.zip
          echo '574fcbe44b15bf2f09dfe36ddb28e9ba798f505c1de40f3055a15b7edb313c24  package.zip' | sha256sum --check --status
          test "$(stat -c%s package.zip)" -eq 159463572
          unzip -tq package.zip
          unzip -Z1 package.zip | grep -Fxq 'resources/app.asar'
          unzip -Z1 package.zip | grep -Fxq 'Sky Sprint.exe'
      - name: Publish package as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases" --method POST -f tag_name=v1.1.1 -f name='Sky Sprint v1.1.1' -f body='Fixes the launch-ticket public key to match the current 7x7Live launcher. Authorization and signed ticket validation remain enabled.' -f make_latest=true
          gh release upload v1.1.1 package.zip#win-unpacked.zip --repo "$GH_REPO"
